# Plan 3b-1 revision set, a REGRESSION set since plan 3b-1b. Run with library_revise.yaml.
#
# Written by the user on 2026-11-20 as plan 3b-1's held-out set. Its results were read in
# plan 3b-1's round 9, so from plan 3b-1b on it is a regression set: run every round, every
# miss explained, not counted in the held-out threshold. Expectations change only with the
# user's approval (plan 3b-1b Task 1 found none that its design changes, 2026-11-21).
# The follow-up sentences and the expected results are the user's. The first requests, the
# first plans and the stock that set each sentence up were filled in from the user's notes.
#
# Keys added for follow-up scenarios (implemented by the runner in plan 3b-1 Task 7):
# - first_plan: [titles] - after the first message's turn, the runner replaces the newest
#   reply's dishes with these library titles as a model version (not edited, no locks), so
#   the follow-up starts from a known plan. Since development run 2 of plan 3b-1b it also
#   replaces that reply's text (the planner's note about its own dishes) with a sentence
#   naming these dishes ("这顿做：A、B、C。", "This meal: A, B, C."), so the follow-up's route
#   and parse read the plan the scenario set, as a real reply names its card's dishes.
# - edits_between_turns: [{add: title} | {remove: title} | {keep: title}] - 3a edits applied
#   in order after `between_turns`, through `apply_edit` and `update_state` as the API does
#   (an add that needs confirmation is confirmed).
# - choice_answer: revise | plan - the answer to the choice card; with no answer the runner
#   stops at the card.
# - expect_route: plan | revise | unsure - the route result of the follow-up.
# - expect_choice_card: bool - whether the choice card appeared on the follow-up.
#   (Plan 3b-2 removed the choice card: choice_answer, expect_choice_card and
#   expect_route: unsure are no longer used; no scenario here sets them.)
# - expect_question: bool - the follow-up ends with a question to the user and no new plan
#   version.
# - expect_unchanged: bool - the dishes after the follow-up equal those before it.
# - expect_removed: [titles] - each is gone after the follow-up.
# - expect_removed_any: [titles] - at least one of them is gone after the follow-up.
# - expect_max_changed: int - at most this many dishes of the plan before the follow-up are
#   gone.
# - expect_any_of: [{expect_* keys}] - the scenario meets this when the follow-up meets every
#   key of at least one entry. Keys outside the list are still all required.
# - library_exclude: [titles] - these library dishes do not exist for this scenario (the
#   runner hides them before the first message and brings them back after).
# - deferred_to: <plan> - the expected result needs a later plan (3b-2 for diner changes in
#   a revise turn). The scenario is run and reported, but left out of plan 3b-1's held-out
#   threshold.
# - Existing keys keep their meaning, judged on the follow-up's plan (expect_titles_include,
#   expect_titles_none, expect_counts, expect_spec, ...).
# - Locked dishes are checked for every scenario without a key: a dish locked before the
#   follow-up and absent after it, not listed in expect_removed, counts as a wrongly removed
#   locked dish.
# The set's role (docs/planning-evaluation-history.md, "Scenario sets").
role: regression
scenarios:
