    follow_up: 玉米的不要，其他的就这样吧
    expect_route: revise
    expect_removed: [松仁玉米]
    expect_titles_exact: [青椒肉丝, 蒜蓉西兰花, 番茄蛋花汤]
    expect_locale_reply: zh
    expect: The corn dish is removed with no replacement; the other three stay.

