    first_plan: [青椒肉丝, 红烧茄子, 蒜蓉西兰花]
    edits_between_turns: [{add: 清炒菠菜}]
    follow_up: 茄子这道不要，换一个别的
    expect_route: revise
    expect_removed: [红烧茄子]
    expect_max_changed: 1
    expect_titles_include: [青椒肉丝, 蒜蓉西兰花, 清炒菠菜]
    expect_counts: {dishes: 4}
    max_model_calls: 12
    expect: The hand-grown plan of four keeps its count; only the eggplant dish changes and the spinach added by hand stays.

