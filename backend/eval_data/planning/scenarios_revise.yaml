# Plan 3b-2 development set: follow-ups on a plan (reader, frame, picker; design
# 2026-11-22-phase-1-plan-3b2-revise-simplification-design.md, section 6). Run with
# library_revise.yaml.
#
# This is the development set: Claude wrote these requests, and they are used while
# building. Plan 3b-2 Task 10 rewrote it for the two layers of spec 6, with new follow-up
# sentences only (none from an earlier version of this set, a held-out or regression set, or
# a prompt's examples). The scenarios that tested the route answer "unsure" or the choice
# card became act-and-say scenarios: the plan changes and the reply says how the message
# was read. The first-message scenarios at the end test the first turn, which plan 3b-2
# leaves as it was.
#
# Two layers:
# - What must never be wrong is checked in code on every scenario of every set, with no key
#   (`must_failures` in minemydinner/evaluation/revise_eval.py): no locked dish removed
#   without its quote, rule or avoidance; no dish removed or added that the scenario does
#   not allow; the counts the message stated are met; diner and one-meal rules are met; no
#   "not in the library" for a library dish; no "0 道菜" / "0 dishes"; an unmet wish is
#   said; no internal words shown (LOCKED and the other plan-line marks, dish ids, "Diner N").
#   A must failure also makes the scenario not as expected, and is counted in
#   `must_violations`.
# - What is acceptable is stated by the keys below; where a sentence has more than one
#   reasonable reading, `expect_any_of` lists every acceptable outcome.
# Which dishes may change comes from expect_removed, expect_removed_any, expect_max_changed,
# expect_unchanged and expect_titles_include, with the frame the run recorded: named
# removals (and dishes that break the new request) may go; with no named removal, the
# dishes the frame let go; titles in expect_titles_include may not go; expect_unchanged:
# true lets nothing go or come. A scenario with none of these keys is checked only by the
# other must checks. A follow-up that ends with a question other than the empty-plan
# question and the which-dish question, while the keys accept a change, is counted apart as
# an unnecessary question; it is never a failure by itself.
#
# Keys (every key is also in Scenario, minemydinner/evaluation/planning.py):
# - first_plan: [titles] - after the first message's turn, the newest reply's dishes become
#   these, as a model version (not edited, no locks), and the reply's text names them, so
#   the follow-up starts from known dishes.
# - edits_between_turns: [{add | remove | keep: title}] - hand edits after first_plan, in
#   order; a dish added by hand is locked.
# - follow_up: the user's next message; it is the judged turn (unless button_after).
# - expect_route: plan | revise | other - what the turn was taken as. A follow-up on a plan
#   is read, not routed: the reading's kind stands for it (change and people: revise,
#   new_meal: plan, other: other); a first message keeps the route model's answer.
#   ("unsure", the choice card's route, is still read for the older sets and never met.)
# - expect_question: bool - the turn ends with a question to the user and no new version.
# - expect_unchanged: bool - the dishes after the turn are those before it.
# - expect_removed: [titles] - each is gone. expect_removed_any: [titles] - one of them is
#   gone. expect_max_changed: n - at most n dishes of the plan before are gone.
# - expect_any_of: [{expect_* keys}] - met when every key of one entry is met; keys outside
#   the list are all required.
# - library_exclude: [titles] - library dishes hidden for this scenario.
# - button_before: <action> - after the first message, the runner presses that next-action
#   button of the newest card (its fixed message, ACTION_MESSAGES), before first_plan and
#   the follow-up: the follow-up is then a message after a button. The scenario stops, not
#   as expected, when the card does not offer it.
# - button_after: <action> - after the last message, the runner presses that button of the
#   newest card; the button turn is then the judged turn. The scenario fails when the card
#   does not offer the button, or the button turn's request was not built in code.
# - expect_next_actions: [actions] - each must be offered on the judged turn's shown card.
#   expect_some_next_action: bool - true: the card offers at least one next action (any
#   kind); false: it offers none.
# - expect_no_question: bool - true: the judged turn asks nothing (no ask-first or count
#   question, answered or not; no which-dish or empty-plan question). false: it asks.
# - expect_wish_unmet: bool - the judged turn says in code-written form that the wish was
#   not met (a wish_unmet entry on its card, the new-plan wish-unmet sentence, or a change
#   that kept the plan and lists what could not be done).
# - expect_follow_up_diner_card: bool - a diner card appears on the follow-up turn itself.
# - expect_request_kept: [fields] - request fields that must be non-empty in the judged
#   turn's request, such as an earlier wish kept after a button.
# - expect_rules_applied / expect_rules_not_applied: [{who, ingredient? | allergen?}] - the
#   rules of the judged turn; `who: meal` is this meal's one-meal avoidance.
# The set's role (docs/planning-evaluation-history.md, "Scenario sets").
role: development
scenarios:
  # ======== drops, replaces and adds ========
  - name: drop_named_corn
    request: 今晚两个人，三个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [松仁玉米, 青椒肉丝, 蒜蓉西兰花]
    follow_up: 玉米那盘撤了吧，不用补
    expect_route: revise
    expect_removed: [松仁玉米]
    expect_titles_exact: [青椒肉丝, 蒜蓉西兰花]
    expect_counts: {dishes: 2}
    expect_no_question: true
    max_model_calls: 12
    expect: The words only say to take the corn away and add nothing, so it is dropped and two dishes stay.
  - name: drop_only_soup
    request: 今晚三个人，两个菜一个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [宫保鸡丁, 清炒菠菜, 紫菜豆腐汤]
    follow_up: 今天不喝汤了
    expect_route: revise
    expect_removed: [紫菜豆腐汤]
    expect_titles_exact: [宫保鸡丁, 清炒菠菜]
    expect_counts: {dishes: 2, soups: 0}
    expect_no_question: true
    max_model_calls: 12
    expect: The plan has one soup and the user wants none today; it is dropped and the two dishes stay.
  - name: replace_slow_ribs
    request: 今晚三个人，三个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [红烧排骨, 清炒小白菜, 番茄炒蛋]
    follow_up: 排骨太费工夫了，换个快手点的
    expect_route: revise
    expect_removed: [红烧排骨]
    expect_max_changed: 1
    expect_titles_include: [清炒小白菜, 番茄炒蛋]
    expect_counts: {dishes: 3, meat_dishes: 1, vegetable_dishes: 2}
    expect_no_question: true
    max_model_calls: 12
    expect: The ribs are replaced by a quicker meat dish of the same type; the other two dishes stay.
  - name: replace_keeps_hand_added
    request: 今晚两个人吃饭，做三个菜，缺什么可以去买。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [鱼香肉丝, 红烧茄子, 蒜蓉西兰花]
    edits_between_turns: [{add: 清炒蘑菇}]
    follow_up: 鱼香肉丝换掉，来个鸡肉做的
    expect_route: revise
    expect_removed: [鱼香肉丝]
    expect_max_changed: 1
    expect_titles_include: [红烧茄子, 蒜蓉西兰花, 清炒蘑菇]
    expect_titles_any: [宫保鸡丁, 香煎鸡腿, 土豆烧鸡块, 辣子鸡, 腰果鸡丁]
    expect_counts: {dishes: 4}
    max_model_calls: 12
    expect: The pork dish is replaced by a chicken dish; the mushrooms added by hand and the other dishes stay, four in all.
  - name: replace_with_named_dish
    request: 今晚两个人，两个菜一个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 蒜蓉西兰花, 番茄蛋花汤]
    follow_up: 西兰花不要了，改成凉拌黄瓜
    expect_route: revise
    expect_removed: [蒜蓉西兰花]
    expect_titles_exact: [青椒肉丝, 凉拌黄瓜, 番茄蛋花汤]
    expect_no_question: true
    max_model_calls: 12
    expect: The named replacement is a library dish, so it takes the broccoli's place with no picker call.
  - name: replace_with_short_name
    request: 今晚两个人，三个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 红烧茄子, 蒜蓉西兰花]
    follow_up: 茄子换成小白菜吧
    # 小白菜 names one library dish (清炒小白菜) by its main ingredient. Saying it is not in
    # the library would break a must check.
    expect_route: revise
    expect_removed: [红烧茄子]
    expect_max_changed: 1
    expect_titles_include: [青椒肉丝, 蒜蓉西兰花, 清炒小白菜]
    expect_counts: {dishes: 3}
    expect_no_question: true
    max_model_calls: 12
    expect: The eggplant dish becomes the bok choy dish the user means; nothing is said to be missing from the library.
  - name: replace_staple_with_noodles
    request: 今晚两个人，两个菜外加一份主食，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 蒜蓉西兰花, 白米饭]
    follow_up: 米饭换成面条吧
    expect_route: revise
    expect_removed: [白米饭]
    expect_max_changed: 1
    expect_titles_include: [青椒肉丝, 蒜蓉西兰花]
    expect_titles_any: [清汤面, 番茄鸡蛋面]
    expect_counts: {dishes: 2, staples: 1}
    expect_no_question: true
    max_model_calls: 12
    expect: The rice is replaced by a noodle staple; "面条" names no single dish, so a noodle dish is chosen.
  - name: add_a_soup
    request: 今晚就我自己，两个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [辣椒炒肉, 清炒菠菜]
    follow_up: 顺手再煮个汤吧
    expect_route: revise
    expect_max_changed: 0
    expect_titles_include: [辣椒炒肉, 清炒菠菜]
    expect_counts: {dishes: 2, soups: 1}
    expect_no_question: true
    max_model_calls: 12
    expect: A soup is added and both dishes stay.

  # ======== general wishes, counts and ambiguous messages ========
  - name: general_lighter_or_added
    request: 周末家里四口人，三个菜一个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [红烧排骨, 家常烧肉, 麻婆豆腐, 冬瓜排骨汤]
    follow_up: 整桌太油腻了，来点清爽的
    expect_route: revise
    # A general wish replaces up to half of the dishes with lighter ones of the same type;
    # "来点" may also read as adding one light dish.
    expect_any_of:
      - {expect_unchanged: false, expect_max_changed: 2, expect_counts: {dishes: 3, soups: 1}}
      - {expect_max_changed: 0, expect_counts: {dishes: 4, soups: 1}}
    expect_no_question: true
    max_model_calls: 12
    expect: One or two greasy dishes give way to lighter ones of the same type, or one light dish is added; the reply says how the message was read when it was ambiguous.
  - name: general_heavier_keeps_hand_added
    request: 周末家里四口人，安排四个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [番茄炒蛋, 清蒸鲈鱼, 蒜蓉西兰花, 土豆炖牛腩]
    edits_between_turns: [{remove: 蒜蓉西兰花}, {add: 清炒小白菜}]
    follow_up: 口味能不能再重一点
    expect_route: revise
    expect_unchanged: false
    expect_max_changed: 2
    expect_titles_include: [清炒小白菜]
    expect_counts: {dishes: 4}
    expect_no_question: true
    max_model_calls: 12
    expect: The bok choy added by hand is locked and the wish names no dish, so it stays; at most two of the other three change.
  - name: too_many_eggs
    request: 今天三个人，三个菜一个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [番茄炒蛋, 嫩滑蒸蛋, 青椒肉丝, 番茄蛋花汤]
    follow_up: 鸡蛋用得有点多
    expect_route: revise
    expect_removed_any: [番茄炒蛋, 嫩滑蒸蛋, 番茄蛋花汤]
    expect_max_changed: 2
    expect_titles_include: [青椒肉丝]
    # Replacing keeps the counts; dropping an egg dish is a reasonable reading too.
    expect_any_of:
      - {expect_counts: {dishes: 3, soups: 1}}
      - {expect_counts: {dishes: 2, soups: 1}}
      - {expect_counts: {dishes: 3, soups: 0}}
    expect_no_question: true
    max_model_calls: 12
    expect: One or two of the egg dishes go or give way to dishes without egg; the pork dish stays and nothing is asked.
  - name: change_the_soups
    request: 今晚四个人吃，两个菜两个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [宫保鸡丁, 清炒小白菜, 冬瓜排骨汤, 紫菜豆腐汤]
    follow_up: 把汤换一换
    # Two soups: "汤" may mean one or both. The more likely reading is acted on and said;
    # "which soup?" is not asked any more.
    expect_route: revise
    expect_removed_any: [冬瓜排骨汤, 紫菜豆腐汤]
    expect_max_changed: 2
    expect_titles_include: [宫保鸡丁, 清炒小白菜]
    expect_counts: {dishes: 2, soups: 2}
    expect_no_question: true
    max_model_calls: 12
    expect: One or both soups are replaced by other soups and the two dishes stay; no question is asked.
  - name: one_soup_is_enough
    request: 今晚四个人吃，两个菜两个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 蒜蓉西兰花, 番茄蛋花汤, 紫菜豆腐汤]
    follow_up: 汤留一个就行
    expect_route: revise
    expect_removed_any: [番茄蛋花汤, 紫菜豆腐汤]
    expect_max_changed: 1
    expect_titles_include: [青椒肉丝, 蒜蓉西兰花]
    expect_counts: {dishes: 2, soups: 1}
    expect_no_question: true
    max_model_calls: 12
    expect: A stated count of one soup drops exactly one soup; which one is the picker's choice, and nothing is asked.
  - name: reference_matches_no_dish
    request: 今晚两个人，两个菜一个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 蒜蓉西兰花, 番茄蛋花汤]
    follow_up: 那个凉菜就不要了
    # No dish is a cold dish: the reply asks which dish was meant (spec 5.6), or the message
    # is taken as not about this plan. Either way the plan stays.
    expect_plan: false
    expect_unchanged: true
    expect_any_of:
      - {expect_question: true}
      - {expect_route: other}
    max_model_calls: 12
    expect: The words point at no dish of the plan, so nothing changes and the reply asks which dish was meant.
  - name: keep_one_replace_the_rest
    request: 今晚两个人，三个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [松仁玉米, 青椒肉丝, 红烧茄子]
    edits_between_turns: [{add: 清炒菠菜}]
    follow_up: 只留下松仁玉米，其他的都换掉
    # Whether "the others" points at the spinach added by hand (locked) is reasonable
    # either way: it is replaced or kept; the two unlocked dishes change in both.
    expect_route: revise
    expect_removed: [青椒肉丝, 红烧茄子]
    expect_titles_include: [松仁玉米]
    expect_counts: {dishes: 4}
    expect_any_of:
      - {expect_removed: [清炒菠菜]}
      - {expect_titles_include: [清炒菠菜]}
    max_model_calls: 12
    expect: The words cover every dish but the corn; both unlocked dishes are replaced, the spinach added by hand is replaced or kept, and the corn stays.
  - name: fewer_on_hand_grown_plan
    request: 今晚两个人，三个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 蒜蓉西兰花, 红烧茄子]
    edits_between_turns: [{add: 清炒小白菜}, {add: 麻婆豆腐}]
    follow_up: 菜有点多，留四个就够
    expect_route: revise
    expect_max_changed: 1
    expect_removed_any: [青椒肉丝, 蒜蓉西兰花, 红烧茄子]
    expect_titles_include: [清炒小白菜, 麻婆豆腐]
    expect_counts: {dishes: 4}
    expect_no_question: true
    max_model_calls: 12
    expect: Five dishes down to four; one of the model's dishes is dropped and both dishes added by hand stay.

  # ======== one-meal avoidances, and taking one back ========
  - name: meal_avoid_beef
    request: 今晚三个人，三个菜，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [土豆炖牛腩, 青椒肉丝, 清炒菠菜]
    follow_up: 这顿别放牛肉
    expect_route: revise
    expect_follow_up_diner_card: false
    expect_removed: [土豆炖牛腩]
    expect_max_changed: 1
    expect_titles_include: [青椒肉丝, 清炒菠菜]
    expect_titles_none: [番茄炖牛腩]
    expect_counts: {dishes: 3}
    expect_rules_applied: [{who: meal, ingredient: 牛肉}]
    expect_no_question: true
    max_model_calls: 12
    expect: Tonight only, so no diner card; the beef dish is replaced by a meat dish without beef and the plan keeps three dishes.
  - name: meal_avoid_covers_hand_added
    request: 今晚三个人，两个菜一个汤，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [宫保鸡丁, 蒜蓉西兰花, 紫菜豆腐汤]
    edits_between_turns: [{add: 腰果鸡丁}]
    follow_up: 今晚鸡肉就算了
    # The cashew chicken added by hand is locked, but the avoidance covers it (spec 5.4).
    expect_route: revise
    expect_follow_up_diner_card: false
    expect_removed: [宫保鸡丁, 腰果鸡丁]
    expect_titles_include: [蒜蓉西兰花, 紫菜豆腐汤]
    expect_titles_none: [香煎鸡腿, 辣子鸡, 土豆烧鸡块]
    expect_counts: {dishes: 3, soups: 1}
    expect_no_question: true
    max_model_calls: 12
    expect: Both chicken dishes, the one added by hand included, are replaced by meat dishes without chicken; the reply says why the locked one changed.
  - name: meal_avoid_shrimp_en
    request: Dinner for the two of us tonight, three dishes. Shopping is fine.
    locale: en
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [油焖大虾, 番茄炒蛋, 清炒小白菜]
    follow_up: Let's skip anything with shrimp tonight.
    # "the two of us" shows the diner card on the first message; the follow-up must not.
    expect_route: revise
    expect_follow_up_diner_card: false
    expect_removed: [油焖大虾]
