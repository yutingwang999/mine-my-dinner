# Plan 3b-1 development set: revising the plan in the conversation (spec 5.6). Run with
# library_revise.yaml.
#
# This is the development set: Claude wrote these requests (the follow-ups include the user's
# five example sentences from the spec, Section 1, and phrases quoted in the spec), and they
# are used while building. It shares no request with the held-out set
# (scenarios_revise_heldout.yaml), which is never tuned against.
#
# Most scenarios fix the first plan (first_plan) so the follow-up starts from known dishes;
# some add or remove dishes by hand first (edits_between_turns): a dish added by hand is
# locked. Every revision is also checked for locked dishes removed without being named.
# The keys are defined in the header of scenarios_revise_heldout.yaml and in Scenario
# (minemydinner/evaluation/planning.py).
#
# Plan 3b-1b development scenarios are at the end (new sentences, none from a held-out set,
# the regression set, or a prompt's examples). The keys plan 3b-1b adds:
# - role: development | regression | held-out - the whole file's role, a top-level key next
#   to `scenarios:` (never per scenario). `summarize` reports each role's rate apart, so a
#   regression set never counts toward the held-out rate.
# - button_after: <action> - after the last message (the follow-up, else the first message),
#   the runner presses that next-action button of the newest card by sending its fixed
#   message (ACTION_MESSAGES). The button turn is then the judged turn: every other
#   expectation, the route, the questions and the plan before and after it, is about that
#   turn. The scenario fails when the card does not offer the button, or when the button
#   turn's request was not built in code (no request["button"] on its run).
# - expect_no_question: bool - true: the judged turn asks nothing (no ask-first or count
#   question, answered or not; no which-dish question; no empty-plan question) and shows no
#   choice card. false: it asks something.
# - expect_wish_unmet: bool - true: the judged turn tells the user in code-written form that
#   the wish was not met: a wish_unmet entry in its card's unmet, the new-plan wish-unmet
#   sentence in its reply, or a revision whose card kept the plan (plan_kept) with at least
#   one unmet entry - a failed revision (every attempt failed a check) or a nothing-fits
#   revision: its reply says the change could not be made and the card says why, so it
#   counts even when no entry names the wish itself. A kept card with no unmet entry (a
#   which-dish question) does not count, nor does a passed revision that says so only in
#   the model's own note.
# - expect_follow_up_diner_card: bool - a diner card appears on the follow-up turn itself
#   (needs follow_up).
# - expect_request_kept: [fields] - request fields (ParsedRequest names) that must be
#   non-empty in the judged turn's request, such as an earlier wish kept after a button.
# - Every scenario is also checked for a reply or unmet text saying the plan has "0 道菜" /
#   "0 dishes" (spec 5.6: never shown).
# The set's role (docs/planning-evaluation-history.md, "Scenario sets").
role: development
scenarios:
  # ---- "茄子这道不要，换一个别的": a named dish swapped, the rest kept ----
  - name: named_swap_eggplant
    request: 今晚两个人吃饭，做三个菜，缺什么可以去买。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 红烧茄子, 蒜蓉西兰花]
    follow_up: 茄子这道不要，换一个别的
    expect_route: revise
    expect_choice_card: false
    expect_removed: [红烧茄子]
    expect_max_changed: 1
    expect_titles_include: [青椒肉丝, 蒜蓉西兰花]
    expect_counts: {dishes: 3}
    expect_locale_reply: zh
    max_model_calls: 12
    expect: Only the eggplant dish is replaced by another dish; the count stays three.
  - name: named_swap_eggplant_after_hand_add
    request: 今晚两个人吃饭，做三个菜，缺什么可以去买。
    locale: zh
