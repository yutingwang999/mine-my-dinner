    expect_route: revise
    expect_follow_up_diner_card: true
    expect_titles_include: [油焖大虾, 牛肉炒洋葱, 番茄炒蛋, 蛋炒饭]
    expect_any_of:
      - {expect_counts: {dishes: 3, soups: 1, staples: 1}, expect_max_changed: 0}
    expect_no_question: true
    max_model_calls: 14
    expect: 小王 joins and a soup is asked for; one soup is added and every dish stays.
  - name: new_guest_with_three_rules
