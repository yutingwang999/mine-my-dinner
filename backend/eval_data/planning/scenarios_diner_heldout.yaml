    follow_up: 小王不来了
    # The user unticks 小王 on the card. 2 -> 1 person: one dish fewer.
    follow_up_diners_answer: {unselect: [小王]}
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_titles_include: [白米饭]
    expect_any_of:
      - {expect_counts: {dishes: 2, staples: 1}, expect_max_changed: 1}
    expect_no_question: true
    max_model_calls: 14
    expect: 小王 is unticked on the card; with one person a dish is dropped and the rice stays.
  - name: both_friends_cancel_only_me
    request: 今天小李小王都来，设计一顿饭，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    friends:
      - {name: 小李, rules: [{type: allergy, allergen: egg}, {type: dietary restriction, ingredient: 牛肉}]}
      - {name: 小王, rules: []}
    first_plan: [青椒肉丝, 蒜蓉西兰花, 紫菜豆腐汤]
    follow_up: 算了，他们不来了，我自己吃
    # The message says one person while three are ticked: the card shows the notice and the
    # user unticks both. 3 -> 1: a dish and the soup go (2 of 3), so the plan is made again
    # for one.
    follow_up_diners_answer: {unselect: [小李, 小王]}
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_stated_total: 1
    expect_rules_not_applied: [{who: 小李, allergen: egg}]
    expect_any_of:
      - {expect_counts: {dishes: 1, soups: 0}}
    expect_no_question: true
    max_model_calls: 14
    expect: Both friends cancel; the card notes that one person was said, the user unticks both, and the plan becomes one dish for one.
  - name: two_more_unnamed_people_make_six
    request: 设计4个人的一顿饭，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [青椒肉丝, 蒜蓉西兰花, 紫菜豆腐汤]
    follow_up: 再加两个人，我们6个人吃
    # Two more people, no names: the card starts from the confirmed four and shows the
    # stated six. 4 -> 6 people: 2 dishes and a soup become 3 and a soup, so one dish more;
    # the first dishes stay.
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_titles_include: [青椒肉丝, 蒜蓉西兰花, 紫菜豆腐汤]
    expect_any_of:
      - {expect_counts: {dishes: 3, soups: 1}, expect_max_changed: 0}
    expect_no_question: true
    max_model_calls: 14
    expect: Two more unnamed people make six; the card shows six, one dish is added and the first dishes stay.
  - name: friend_joins_and_one_dish_goes
    request: 今晚三个菜一个主食，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    friends:
      - {name: 小李, rules: [{type: allergy, allergen: egg}, {type: dietary restriction, ingredient: 牛肉}]}
    first_plan: [油焖大虾, 牛肉炒洋葱, 番茄炒蛋, 蛋炒饭]
    follow_up: 小李也来，牛肉那道不要了
    # The beef dish goes by the message (and by 小李's rule); the egg dishes break 小李's
    # allergy: 3 of 4 must change, so the plan is made again. A removal does not turn the
    # count difference off (1 -> 2: one dish more); a reading that drops the beef dish may
    # leave one dish fewer.
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_rules_applied: [{who: 小李, allergen: egg}]
    expect_titles_none: [牛肉炒洋葱, 番茄炒蛋, 蛋炒饭]
    expect_any_of:
      - {expect_counts: {dishes: 4, staples: 1}}
      - {expect_counts: {dishes: 3, staples: 1}}
    expect_no_question: true
    max_model_calls: 14
    expect: 小李 joins and the beef dish goes; the egg dishes break 小李's allergy, so the plan is made again without egg or beef.
  - name: friend_joins_and_a_soup
