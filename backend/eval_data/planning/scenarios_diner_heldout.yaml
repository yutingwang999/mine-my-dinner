# Plan 3b-2 (two) held-out set: a change in who eats on an existing plan, and the reader
# items of follow_up_v5 (design 2026-11-26-phase-1-plan-3b2-diner-changes-design.md,
# section 6). Run with library_diner_heldout.yaml.
#
# Held-out: the user wrote the follow-up sentences (and the situations); Claude wrote the
# set-up (first request, first plan, friends) and the expectations. Implementers and
# reviewers never open this file, and its sentences go into no prompt, doc or test.
#
# Keys as in scenarios_revise.yaml and scenarios_diner_changes.yaml (their headers define
# them). Counts after the card (design 5.3): the default composition is 1 dish for 1 person,
# 2 dishes for 2, 2 dishes and a soup for 3-4, 3 dishes and a soup for 5 or more; the
# plan's dishes and soups move by the difference, unless the message adds a dish or states
# a count. More than half of the plan to change makes it again (design 5.4).
#
# "炒饭" in the situations is 蛋炒饭 (the library's fried rice has egg).
role: held-out
scenarios:
  - name: friend_with_allergies_joins_a_solo_plan
    request: 今晚三个菜一个主食，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    friends:
      - {name: 小李, rules: [{type: allergy, allergen: egg}, {type: dietary restriction, ingredient: 牛肉}]}
    first_plan: [红烧茄子, 洋葱炒鸡蛋, 松仁玉米, 蛋炒饭]
    follow_up: 小李也来
    # A solo plan (no card): the follow-up card starts from the user alone. 1 -> 2 people:
    # one dish more. 小李's egg allergy breaks the onion-egg dish and the egg fried rice (2
    # of 4, not more than half): both are replaced, the other two stay.
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_rules_applied: [{who: 小李, allergen: egg}]
    expect_titles_none: [洋葱炒鸡蛋, 蛋炒饭]
    expect_titles_include: [红烧茄子, 松仁玉米]
    expect_any_of:
      - {expect_counts: {dishes: 4, staples: 1}}
    expect_no_question: true
    max_model_calls: 14
    expect: 小李's known egg and beef rules apply; the egg dishes are replaced, one dish is added for two people, and the other dishes stay.
  - name: friend_with_allergies_joins_a_hand_edited_plan
    request: 今晚三个菜一个主食，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    friends:
      - {name: 小李, rules: [{type: allergy, allergen: egg}, {type: dietary restriction, ingredient: 牛肉}]}
    first_plan: [红烧茄子, 洋葱炒鸡蛋, 松仁玉米, 蛋炒饭]
    edits_between_turns: [{add: 牛肉炒洋葱}]
    follow_up: 小李也来
    # The hand-added beef dish (locked) breaks 小李's beef rule and goes despite the lock; the
    # two egg dishes go too: 3 of 5 must change, more than half, so the plan is made again.
    # 1 -> 2 people: one dish more.
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_rules_applied: [{who: 小李, allergen: egg}, {who: 小李, ingredient: 牛肉}]
    expect_titles_none: [洋葱炒鸡蛋, 蛋炒饭, 牛肉炒洋葱]
    expect_any_of:
      - {expect_counts: {dishes: 5, staples: 1}}
    expect_no_question: true
    max_model_calls: 14
    expect: The hand-added beef dish and the egg dishes break 小李's rules; most of the plan changes, so it is made again without egg or beef, one dish larger.
  - name: one_more_person_no_rule
    request: 今晚两个人，三个菜一个主食，可以买菜。
    locale: zh
    inventory: {}
    cookware: [炒锅, 平底锅, 汤锅, 砂锅, 蒸锅, 高压锅]
    first_plan: [油焖大虾, 青椒肉丝, 清炒小白菜, 白米饭]
    follow_up: 再加个人
    # An unnamed person with no rule: 2 -> 3 people adds a soup; nothing breaks.
    expect_route: revise
    expect_follow_up_diner_card: true
    expect_titles_include: [油焖大虾, 青椒肉丝, 清炒小白菜, 白米饭]
    expect_any_of:
      - {expect_counts: {dishes: 3, soups: 1, staples: 1}, expect_max_changed: 0}
    expect_no_question: true
    max_model_calls: 14
    expect: One more person with no rule joins; every dish stays and a soup is added for three.
  - name: the_only_guest_cancels
    request: 今天小王来吃饭，三个菜一个主食，可以买菜。
    locale: zh
